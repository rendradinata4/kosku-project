name: Supabase keep-alive
on:
  schedule:
    - cron: "0 3 * * 1,4"   # Senin dan Kamis, 03:00 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/kos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"